<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Night PDF Light</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        #toolbar {
            padding: 8px;
            background: #222;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            transition: transform 0.2s ease;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        #toolbar.hidden { transform: translateY(-100%); }

        #toggleMenu {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 101;
            padding: 10px 14px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        button, input {
            padding: 8px 12px;
            cursor: pointer;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 13px;
            touch-action: manipulation;
        }

        input[type="text"], input[type="number"], input[type="file"] {
            background: #222;
            max-width: 100%;
        }

        #pdf-container {
            position: relative;
            margin-top: 180px;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        #toolbar.hidden ~ #pdf-container { margin-top: 20px; }

        canvas {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto !important;
        }

        canvas.theme-invert { filter: invert(1); }
        canvas.theme-normal { filter: none; }
        canvas.theme-sepia { filter: sepia(0.8) contrast(1.2) brightness(0.9); }

        @media (max-width: 600px) {
            #pdf-container { margin-top: 220px; }
        }
    </style>
</head>
<body>

<div id="toolbar">
    <div class="toolbar-group">
        <input type="file" id="fileInput" accept="application/pdf">
        <button id="colorBtn" onclick="toggleColorTheme()">🌙 Invertido</button>
    </div>
    
    <div class="toolbar-group">
        <button onclick="prevPage()">← Anterior</button> 
        <span id="pageInfo" style="font-size: 13px; min-width: 80px;">Página 0 / 0</span> 
        <button onclick="nextPage()">Próxima →</button>
    </div>
    
    <div class="toolbar-group">
        <input type="number" id="pageInput" min="1" style="width: 50px;" placeholder="Pág">
        <button onclick="goToPage()">Ir</button>
        <button onclick="zoomOut()">Zoom -</button> 
        <button onclick="zoomIn()">Zoom +</button>
    </div>

    <div class="toolbar-group" style="border-top: 1px solid #444; padding-top: 4px; width: 100%;">
        <input type="text" id="searchInput" placeholder="Buscar..." style="width: 120px;">
        <button onclick="searchWord()">Buscar</button>
        <button onclick="prevMatch()">←</button>
        <button onclick="nextMatch()">→</button>
    </div>
    <span id="searchInfo" style="font-size: 11px; color: #aaa; display: block;"></span>
</div>

<button id="toggleMenu" onclick="toggleMenu()">Ocultar Menu</button>

<div id="pdf-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
let pdfDoc = null;
let currentPage = 1;
let scale = window.innerWidth < 600 ? 0.95 : 1.2;
let isRendering = false;
let renderTask = null;

const themes = ['invert', 'normal', 'sepia'];
const themeLabels = {
    'invert': '🌙 Invertido',
    'normal': '☀️ Normal',
    'sepia': '📜 Sépia'
};
let currentThemeIndex = 0;

let pdfPagesText = []; 
let searchMatches = []; 
let currentMatchIndex = -1; 

const container = document.getElementById('pdf-container');
const toolbar = document.getElementById('toolbar');
const toggleBtn = document.getElementById('toggleMenu');
const pageInfo = document.getElementById('pageInfo');
const pageInput = document.getElementById('pageInput');
const searchInput = document.getElementById('searchInput');
const searchInfo = document.getElementById('searchInfo');
const colorBtn = document.getElementById('colorBtn');

function toggleMenu() {
    toolbar.classList.toggle('hidden');
    toggleBtn.textContent = toolbar.classList.contains('hidden') ? "Mostrar Menu" : "Ocultar Menu";
}

function toggleColorTheme() {
    currentThemeIndex = (currentThemeIndex + 1) % themes.length;
    colorBtn.textContent = themeLabels[themes[currentThemeIndex]];
    const canvas = document.querySelector('canvas');
    if (canvas) canvas.className = `theme-${themes[currentThemeIndex]}`;
}

// Renderização Ultra Leve
function renderPage(num) {
    if (!pdfDoc) return;
    
    // Cancela a renderização anterior se o usuário mudar de página rapidamente
    if (renderTask) {
        renderTask.cancel();
    }

    isRendering = true;

    pdfDoc.getPage(num).then(function(page) {
        // Limita o DPR no mobile em no máximo 1.5x para não sobrecarregar a memória
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: false }); // Desativa alpha para renderizar mais rápido

        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvas.className = `theme-${themes[currentThemeIndex]}`;

        renderTask = page.render({
            canvasContext: context,
            viewport: viewport
        });

        renderTask.promise.then(function() {
            container.innerHTML = "";
            container.appendChild(canvas);
            pageInfo.textContent = `${currentPage} / ${pdfDoc.numPages}`;
            isRendering = false;
        }).catch(function(err) {
            if (err.name !== 'RenderingCancelledException') {
                isRendering = false;
            }
        });
    });
}

function nextPage() {
    if (pdfDoc && currentPage < pdfDoc.numPages) {
        currentPage++;
        renderPage(currentPage);
    }
}

function prevPage() {
    if (pdfDoc && currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
    }
}

function goToPage() {
    if (!pdfDoc) return;
    const page = parseInt(pageInput.value);
    if (page >= 1 && page <= pdfDoc.numPages) {
        currentPage = page;
        renderPage(currentPage);
    }
}

function zoomIn() {
    if (!pdfDoc) return;
    scale += 0.15;
    renderPage(currentPage);
}

function zoomOut() {
    if (!pdfDoc) return;
    if (scale > 0.4) {
        scale -= 0.15;
        renderPage(currentPage);
    }
}

// Indexação sob demanda para economizar RAM
async function searchWord() {
    const query = searchInput.value.trim().toLowerCase();
    if (!query || !pdfDoc) return;

    searchInfo.textContent = "Buscando...";

    if (pdfPagesText.length === 0) {
        for (let i = 1; i <= pdfDoc.numPages; i++) {
            const page = await pdfDoc.getPage(i);
            const textContent = await page.getTextContent();
            const text = textContent.items.map(item => item.str).join(" ").toLowerCase();
            pdfPagesText.push({ pageNum: i, text });
        }
    }

    searchMatches = pdfPagesText.filter(p => p.text.includes(query)).map(p => p.pageNum);

    if (searchMatches.length > 0) {
        currentMatchIndex = 0;
        goToMatch();
    } else {
        searchInfo.textContent = "Sem resultados.";
    }
}

function goToMatch() {
    if (currentMatchIndex >= 0 && currentMatchIndex < searchMatches.length) {
        currentPage = searchMatches[currentMatchIndex];
        renderPage(currentPage);
        searchInfo.textContent = `${currentMatchIndex + 1}/${searchMatches.length} (Pág. ${currentPage})`;
    }
}

function nextMatch() {
    if (searchMatches.length === 0) return;
    currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
    goToMatch();
}

function prevMatch() {
    if (searchMatches.length === 0) return;
    currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
    goToMatch();
}

// Gestos Swipe leves
let touchStartX = 0;
let touchEndX = 0;

container.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].clientX;
}, { passive: true });

container.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].clientX;
    if (touchEndX < touchStartX - 60) nextPage();
    if (touchEndX > touchStartX + 60) prevPage();
}, { passive: true });

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const fileReader = new FileReader();
    fileReader.onload = function() {
        const typedarray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
            pdfDoc = pdf;
            currentPage = 1;
            pdfPagesText = [];
            renderPage(currentPage);
            searchInfo.textContent = "";
        });
    };
    fileReader.readAsArrayBuffer(file);
});
</script>

</body>
</html>
